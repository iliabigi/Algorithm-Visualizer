<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Practice</title>
    <link href="./styles.css" rel="stylesheet">
    <script type="module" defer src="./script.js"></script> 
</head>

<body>
    <div class="top">
        <button class="startButton">START</button>
        <div class="sizeButtons">
            <button class="makeLarger">+</button>
            <button class="makeSmaller">-</button>
        </div>
    </div>

    <div class="canvases">
        <div class="containCanvas">
            <canvas class="mainCanvas"></canvas>
            <select name="algorithms" class="mainSelect">
                <option value="A*">A*</option>
                <option value="Weighted A*">Weighted A*</option>
                <option value="BFS">BFS</option>
                <option value="Dijkstra">Dijkstra</option>
            </select>
        </div>

    </div>

</body>
</html>
