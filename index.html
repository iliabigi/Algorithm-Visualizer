<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Practice</title>
    <link href="./styles.css" rel="stylesheet">
    <script defer src="./perlin.js"></script>
    <script type="module" defer src="./script.js"></script> 

</head>

<body>
    <div class="top">
        <div class="functionButtons">
            <button class="startButton">START</button>
            <button class="regenButton">REGENERATE</button>
            <div class="speedButtons">
                <button data-speed="1">1x</button>
                <button data-speed="2">2x</button>
                <button data-speed="5">5x</button>
                <button data-speed="15">super</button>
            </div>
            <input class="noiseSwitch" type="checkbox">
        </div>
        <div class="input">
            <label for="sizeInput">Canvas Size:</label>
            <input class="sizeInput" type="number" value="500" step="50">
        </div>
        
        </div>
    </div>

    <div class="canvases">
        <div class="containCanvas">
            <canvas class="mainCanvas"></canvas>
            <select name="algorithms" class="mainSelect">
                <option value="A*">A*</option>
                <option value="Weighted A*">Weighted A*</option>
                <option value="BFS">BFS</option>
                <option value="Dijkstra">Dijkstra</option>
            </select>
        </div>
    </div>

</body>
</html>
